name: TEMP Chat Cancel Diagnostic

on:
  pull_request:
    branches:
      - develop/pathena-next
    paths:
      - "src/athena/api/**"
      - "src/athena/chat/**"
      - "tests/unit/test_chat_cancellation_registry.py"
      - "tests/unit/test_core_api_chat_cancellation.py"
      - "tests/unit/test_core_api_asgi.py"
      - "tests/unit/test_core_api_client.py"
      - "tests/unit/test_core_api_direct_chat.py"
      - "tests/unit/test_core_api_send_operation_reconciliation.py"
      - "tests/unit/test_direct_chat_send_identity.py"
      - ".github/workflows/_chat-cancel-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked dev environment
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.21"
          uv lock --check
          uv sync --locked --extra dev --extra desktop

      - name: Ruff touched cancellation slice
        id: ruff
        continue-on-error: true
        run: |
          files="src/athena/api/asgi.py src/athena/api/client.py src/athena/api/executor.py src/athena/api/ports.py src/athena/api/service.py src/athena/chat/cancellation.py src/athena/chat/direct.py src/athena/chat/generation.py src/athena/chat/unified.py tests/unit/test_chat_cancellation_registry.py tests/unit/test_core_api_chat_cancellation.py tests/unit/test_core_api_asgi.py tests/unit/test_core_api_client.py tests/unit/test_core_api_direct_chat.py tests/unit/test_core_api_send_operation_reconciliation.py tests/unit/test_direct_chat_send_identity.py"
          set +e
          uv run --locked --extra dev --extra desktop --no-sync ruff check $files
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            uv run --locked --extra dev --extra desktop --no-sync ruff check --fix $files || true
            echo "----- RUFF FIX DIFF -----"
            git diff -- $files
            git reset --hard HEAD
            exit "$status"
          fi

      - name: Mypy production tree
        id: mypy
        continue-on-error: true
        run: uv run --locked --extra dev --extra desktop --no-sync python -m mypy src/athena

      - name: Focused cancellation pytest
        id: pytest
        continue-on-error: true
        run: |
          uv run --locked --extra dev --extra desktop --no-sync pytest -q \
            tests/unit/test_chat_cancellation_registry.py \
            tests/unit/test_core_api_chat_cancellation.py \
            tests/unit/test_core_api_asgi.py \
            tests/unit/test_core_api_client.py \
            tests/unit/test_core_api_direct_chat.py \
            tests/unit/test_core_api_send_operation_reconciliation.py \
            tests/unit/test_direct_chat_send_identity.py

      - name: Enforce diagnostics
        if: always()
        run: |
          echo "ruff=${{ steps.ruff.outcome }}"
          echo "mypy=${{ steps.mypy.outcome }}"
          echo "pytest=${{ steps.pytest.outcome }}"
          test "${{ steps.ruff.outcome }}" = "success"
          test "${{ steps.mypy.outcome }}" = "success"
          test "${{ steps.pytest.outcome }}" = "success"
