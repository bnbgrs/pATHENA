name: pATHENA durable filesystem contract

on:
  push:
    branches:
      - bot/pathena-cloud-windows
    paths:
      - .github/workflows/windows-durable-fs-contract.yml
      - .github/windows-candidate-request.txt

permissions:
  contents: read

jobs:
  exact-durable-fs:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: harness
          persist-credentials: false
      - name: Resolve exact candidate
        shell: pwsh
        run: |
          $candidate = (Get-Content 'harness\.github\windows-candidate-request.txt' -Raw).Trim().ToLowerInvariant()
          if ($candidate -notmatch '^[0-9a-f]{40}$') { throw 'Candidate request must be an exact lowercase SHA.' }
          "CANDIDATE_SHA=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Checkout exact candidate SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Prove immutable candidate identity
        shell: pwsh
        run: |
          $checkedOut = (git -C candidate rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkedOut -ne $env:CANDIDATE_SHA) { throw "Checked out $checkedOut instead of $env:CANDIDATE_SHA." }
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install locked development environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.11.21'
          if ($LASTEXITCODE -ne 0) { throw 'uv installation failed.' }
          Push-Location candidate
          try {
            uv lock --check
            if ($LASTEXITCODE -ne 0) { throw 'uv.lock is not current.' }
            uv sync --locked --extra dev
            if ($LASTEXITCODE -ne 0) { throw 'Locked development sync failed.' }
          } finally { Pop-Location }
      - name: Ruff durable filesystem
        shell: pwsh
        run: |
          Push-Location candidate
          try {
            uv run --locked --extra dev --no-sync ruff check src/athena/storage/durable_fs.py tests/unit/test_durable_fs.py
            if ($LASTEXITCODE -ne 0) { throw 'Durable filesystem Ruff contract failed.' }
          } finally { Pop-Location }
      - name: Mypy durable filesystem
        shell: pwsh
        run: |
          Push-Location candidate
          try {
            uv run --locked --extra dev --no-sync mypy src/athena/storage/durable_fs.py
            if ($LASTEXITCODE -ne 0) { throw 'Durable filesystem mypy contract failed.' }
          } finally { Pop-Location }
      - name: Pytest native Windows durable filesystem cases
        shell: pwsh
        run: |
          Push-Location candidate
          try {
            uv run --locked --extra dev --no-sync pytest -q tests/unit/test_durable_fs.py -k windows
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows durable filesystem tests failed.' }
          } finally { Pop-Location }
