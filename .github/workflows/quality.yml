name: ATHENA Quality Gate

on:
  push:
    branches:
      - main
      - develop/pathena-next
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Python 3.12 quality
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1

      - name: Validate dependency lock
        run: uv lock --check

      # Keep every canonical check independently observable while still running all four.
      # Persist complete text diagnostics so release verification does not depend on
      # transient Actions log access.
      - name: Quality — specification validator
        id: quality_spec
        run: |
          set -o pipefail
          mkdir -p .quality-evidence
          uv run --locked --extra dev --extra desktop python scripts/validate_spec.py 2>&1 | tee .quality-evidence/specification-validator.txt

      - name: Quality — Ruff
        id: quality_ruff
        if: always()
        run: |
          set -o pipefail
          mkdir -p .quality-evidence
          uv run --locked --extra dev --extra desktop python -m ruff check src tests scripts 2>&1 | tee .quality-evidence/ruff.txt

      - name: Quality — mypy
        id: quality_mypy
        if: always()
        run: |
          set -o pipefail
          mkdir -p .quality-evidence
          uv run --locked --extra dev --extra desktop python -m mypy src/athena 2>&1 | tee .quality-evidence/mypy.txt

      - name: Quality — pytest
        id: quality_pytest
        if: always()
        timeout-minutes: 40
        run: |
          set -o pipefail
          mkdir -p .quality-evidence

          # PySide owns process-global native state. Keep the controller's real
          # off-UI-thread regression fully mandatory, but execute it in its own
          # interpreter so prior Qt tests cannot poison its native event-loop state.
          set +e
          uv run --locked --extra dev --extra desktop python -m pytest tests/unit/test_desktop_api_controller.py 2>&1 | tee .quality-evidence/pytest-desktop-api-controller.txt
          controller_status=${PIPESTATUS[0]}

          # Run every remaining test in the canonical suite exactly once. The
          # isolated controller module above is the only excluded path here.
          uv run --locked --extra dev --extra desktop python -m pytest --ignore=tests/unit/test_desktop_api_controller.py 2>&1 | tee .quality-evidence/pytest.txt
          suite_status=${PIPESTATUS[0]}
          set -e

          if [ "$controller_status" -ne 0 ] || [ "$suite_status" -ne 0 ]; then
            echo "ATHENA PYTEST: FAIL — controller=$controller_status suite=$suite_status" >&2
            exit 1
          fi
          echo "ATHENA PYTEST: PASS — isolated controller and remaining canonical suite"

      - name: Upload canonical quality diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-quality-diagnostics-${{ env.CANDIDATE_SHA }}
          path: .quality-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Enforce canonical quality result
        if: ${{ always() && !cancelled() }}
        env:
          SPEC_OUTCOME: ${{ steps.quality_spec.outcome }}
          RUFF_OUTCOME: ${{ steps.quality_ruff.outcome }}
          MYPY_OUTCOME: ${{ steps.quality_mypy.outcome }}
          PYTEST_OUTCOME: ${{ steps.quality_pytest.outcome }}
        run: |
          python - <<'PY'
          import os
          import sys

          outcomes = {
              "Specification validator": os.environ["SPEC_OUTCOME"],
              "Ruff": os.environ["RUFF_OUTCOME"],
              "mypy": os.environ["MYPY_OUTCOME"],
              "pytest": os.environ["PYTEST_OUTCOME"],
          }
          failures = [name for name, outcome in outcomes.items() if outcome != "success"]
          for name, outcome in outcomes.items():
              print(f"{name}: {outcome}")
          if failures:
              print("ATHENA QUALITY GATE: FAIL — " + ", ".join(failures), file=sys.stderr)
              sys.exit(1)
          print("ATHENA QUALITY GATE: PASS")
          PY

  storage-regressions:
    name: Linux storage regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Validate dependency lock
        run: uv lock --check

      - name: Run focused storage regressions
        run: uv run --locked --extra dev pytest -q tests/unit/test_storage_locality.py tests/unit/test_database_preflight_locality.py tests/unit/test_runtime_paths.py tests/unit/test_durable_fs.py tests/unit/test_durable_fs_parent_identity.py tests/unit/test_migration_safety.py tests/unit/test_migration_clone.py tests/unit/test_migration_journal.py tests/unit/test_migration_activation.py tests/unit/test_migration_lock.py tests/unit/test_migration_executor.py tests/unit/test_migration_plan.py tests/unit/test_migration_recovery.py tests/unit/test_migration_coordinator.py tests/unit/test_emergency_reserve.py tests/unit/test_disk_pressure.py tests/unit/test_pressure_database.py tests/unit/test_read_only_database.py tests/unit/test_storage_safe_mode.py tests/unit/test_storage_bootstrap.py

      - name: Run API runtime path-boundary regressions
        run: uv run --locked --extra dev pytest -q tests/unit/test_api_runtime_boundaries.py

  local-smoke:
    name: Local install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Validate dependency lock
        run: uv lock --check

      - name: Run disposable Core/API restart smoke
        run: uv run --locked --extra dev athena-local-smoke --restart-cycles 1

      - name: Verify pypdf packaging metadata
        run: uv run --locked --extra dev athena-packaging-smoke --json

  windows-path-safety:
    name: Windows path safety
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Validate dependency lock
        run: uv lock --check

      # Keep every Windows release guard independently observable. A failure in one
      # guard must not hide the state of later, disjoint release contracts.
      - name: Probe native active-state locality
        id: windows_active_state_locality
        continue-on-error: true
        run: uv run --locked --extra dev python -c "from pathlib import Path; from athena.storage.locality import assert_active_state_root_local; assert_active_state_root_local(Path.cwd())"

      - name: Run deterministic Windows locality regressions
        id: windows_locality
        continue-on-error: true
        run: uv run --locked --extra dev pytest -q tests/unit/test_storage_locality.py -k windows

      - name: Run Windows storage path regressions
        id: windows_storage
        continue-on-error: true
        run: uv run --locked --extra dev pytest -q tests/unit/test_database_preflight_locality.py tests/unit/test_runtime_paths.py tests/unit/test_migration_clone.py tests/unit/test_migration_journal.py tests/unit/test_migration_activation.py tests/unit/test_migration_lock.py tests/unit/test_migration_executor.py tests/unit/test_migration_recovery.py tests/unit/test_emergency_reserve.py tests/unit/test_disk_pressure.py tests/unit/test_pressure_database.py tests/unit/test_read_only_database.py tests/unit/test_storage_safe_mode.py tests/unit/test_storage_bootstrap.py tests/unit/test_schema_reinitialization_contract.py

      - name: Run Windows durable filesystem regressions
        id: windows_durable_fs
        continue-on-error: true
        run: uv run --locked --extra dev pytest -q tests/unit/test_durable_fs.py -k "not test_posix"

      - name: Run API runtime path-boundary regressions
        id: windows_api_runtime
        continue-on-error: true
        run: uv run --locked --extra dev pytest -q tests/unit/test_api_runtime_boundaries.py

      - name: Run Windows Core/API ownership lifecycle regressions
        id: windows_ownership
        continue-on-error: true
        run: uv run --locked --extra dev pytest -q tests/unit/test_api_process_lock_boundaries.py tests/unit/test_api_process_lifecycle_boundaries.py tests/unit/test_api_server_lifecycle_boundaries.py

      - name: Run Windows packaged runtime contract regressions
        id: windows_packaged_runtime
        continue-on-error: true
        run: uv run --locked --extra dev --extra desktop pytest -q tests/unit/test_packaged_app_dispatch.py tests/unit/test_packaged_process_launch.py tests/unit/test_windows_packaging_contract.py

      - name: Run Windows adaptive chat reserve contract
        id: windows_chat_reserve
        continue-on-error: true
        run: uv run --locked --extra dev pytest -q tests/unit/test_chat_context_reserve_contract.py

      - name: Run Windows Core/API restart smoke
        id: windows_restart_smoke
        continue-on-error: true
        run: uv run --locked --extra dev athena-local-smoke --restart-cycles 1

      - name: Verify Windows pypdf packaging metadata
        id: windows_pypdf_packaging
        continue-on-error: true
        run: uv run --locked --extra dev athena-packaging-smoke --json

      - name: Enforce Windows release-guard result
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        env:
          ACTIVE_STATE_OUTCOME: ${{ steps.windows_active_state_locality.outcome }}
          LOCALITY_OUTCOME: ${{ steps.windows_locality.outcome }}
          STORAGE_OUTCOME: ${{ steps.windows_storage.outcome }}
          DURABLE_FS_OUTCOME: ${{ steps.windows_durable_fs.outcome }}
          API_RUNTIME_OUTCOME: ${{ steps.windows_api_runtime.outcome }}
          OWNERSHIP_OUTCOME: ${{ steps.windows_ownership.outcome }}
          PACKAGED_RUNTIME_OUTCOME: ${{ steps.windows_packaged_runtime.outcome }}
          CHAT_RESERVE_OUTCOME: ${{ steps.windows_chat_reserve.outcome }}
          RESTART_SMOKE_OUTCOME: ${{ steps.windows_restart_smoke.outcome }}
          PYPDF_PACKAGING_OUTCOME: ${{ steps.windows_pypdf_packaging.outcome }}
        run: |
          $outcomes = [ordered]@{
            "Active-state locality" = $env:ACTIVE_STATE_OUTCOME
            "Deterministic locality" = $env:LOCALITY_OUTCOME
            "Storage paths" = $env:STORAGE_OUTCOME
            "Durable filesystem" = $env:DURABLE_FS_OUTCOME
            "API runtime boundaries" = $env:API_RUNTIME_OUTCOME
            "Core/API ownership" = $env:OWNERSHIP_OUTCOME
            "Packaged runtime" = $env:PACKAGED_RUNTIME_OUTCOME
            "Adaptive chat reserve" = $env:CHAT_RESERVE_OUTCOME
            "Core/API restart smoke" = $env:RESTART_SMOKE_OUTCOME
            "pypdf packaging" = $env:PYPDF_PACKAGING_OUTCOME
          }
          $failures = @()
          foreach ($entry in $outcomes.GetEnumerator()) {
            Write-Host "$($entry.Key): $($entry.Value)"
            if ($entry.Value -ne "success") {
              $failures += $entry.Key
            }
          }
          if ($failures.Count -gt 0) {
            throw "ATHENA WINDOWS RELEASE GUARDS: FAIL — $($failures -join ', ')"
          }
          Write-Host "ATHENA WINDOWS RELEASE GUARDS: PASS"
