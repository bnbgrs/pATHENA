name: pATHENA UI GAP 0004 Focused Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out exact UI candidate
        uses: actions/checkout@v6
        with:
          ref: a5d9530525bd0b6bf0eae3945c23a6805f6b9669

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1

      - name: Validate dependency lock
        run: uv lock --check

      - name: Ruff startup harness
        run: uv run --locked --extra dev --extra desktop python -m ruff check tests/unit/test_pathena_startup_experience_2900.py tests/unit/test_pathena_offline_comprehension.py

      - name: Focused startup and offline tests
        run: uv run --locked --extra dev --extra desktop python -m pytest -q tests/unit/test_pathena_startup_experience_2900.py tests/unit/test_pathena_offline_comprehension.py
