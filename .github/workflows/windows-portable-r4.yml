name: pATHENA Windows Portable R4

on:
  pull_request:
    branches:
      - develop/pathena-next
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  SOURCE_SHA: d14aca9504021bdacadb89dc478ca41545ab4316
  PACKAGE_NAME: pATHENA-Windows-Portable-d14aca95

jobs:
  build-and-smoke-test:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out exact packaging branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv and validate locked desktop environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.21"
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv.lock is not current." }
          uv sync --locked --extra desktop
          if ($LASTEXITCODE -ne 0) { throw "Locked desktop environment sync failed." }

      - name: Build supported two-executable portable package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "pathena-portable-r4"
          pwsh -NoProfile -File scripts/build_windows_portable.ps1 -OutputRoot $out
          if ($LASTEXITCODE -ne 0) { throw "Supported Windows portable build failed." }
          $pkg = Join-Path $out "pATHENA"
          foreach ($required in @("pATHENA.exe", "pATHENA-Worker.exe", "START_HERE.txt", "CHECK_HARDWARE.cmd", "app_runtime")) {
            if (-not (Test-Path (Join-Path $pkg $required))) { throw "Missing package component: $required" }
          }

      - name: Smoke-test worker routing
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "pathena-portable-r4\pATHENA"
          $worker = Join-Path $pkg "pATHENA-Worker.exe"
          foreach ($arguments in @(
            @("-m", "athena", "--help"),
            @("-m", "athena.api.process", "--help")
          )) {
            $process = Start-Process -FilePath $worker -WorkingDirectory $pkg -ArgumentList $arguments -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) {
              throw "Worker role smoke failed with exit code $($process.ExitCode): $($arguments -join ' ')"
            }
          }

      - name: Exercise real desktop process tree in isolated runtime
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "pathena-portable-r4\pATHENA"
          $exe = Join-Path $pkg "pATHENA.exe"
          $runtime = Join-Path $env:RUNNER_TEMP "pathena-r4-runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $env:ATHENA_LOCAL_ROOT = $runtime
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $env:QT_OPENGL = "software"
          $desktop = $null
          try {
            $desktop = Start-Process -FilePath $exe -WorkingDirectory $pkg -PassThru
            $deadline = (Get-Date).AddSeconds(35)
            $discovery = Join-Path $runtime "tmp\core-api\core-api.json"
            do {
              Start-Sleep -Milliseconds 500
              $desktop.Refresh()
              if ($desktop.HasExited) {
                throw "pATHENA desktop exited during startup with code $($desktop.ExitCode)."
              }
            } while (-not (Test-Path $discovery) -and (Get-Date) -lt $deadline)

            if (-not (Test-Path $discovery)) {
              throw "Core discovery file was not created within 35 seconds."
            }

            Start-Sleep -Seconds 4
            $desktopCount1 = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq "pATHENA.exe" }).Count
            $workerCount1 = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq "pATHENA-Worker.exe" }).Count
            Start-Sleep -Seconds 6
            $desktopCount2 = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq "pATHENA.exe" }).Count
            $workerCount2 = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq "pATHENA-Worker.exe" }).Count

            Write-Host "Desktop count: $desktopCount1 -> $desktopCount2"
            Write-Host "Worker count: $workerCount1 -> $workerCount2"
            if ($desktopCount2 -ne 1) { throw "Expected exactly one desktop process, found $desktopCount2." }
            if ($workerCount2 -gt $workerCount1) { throw "Worker process count grew from $workerCount1 to $workerCount2." }
            if ($workerCount2 -gt 12) { throw "Worker process count $workerCount2 exceeds bounded ceiling." }

            $patterns = @(
              "duplicate column name: source_processing_job_id",
              "ATHENA Core startup failed",
              "Failed to start service 'storage-bootstrap'"
            )
            $bad = Get-ChildItem -Path $runtime -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -lt 10MB } |
              Select-String -Pattern $patterns -SimpleMatch -ErrorAction SilentlyContinue
            if ($bad) {
              $bad | ForEach-Object { Write-Host $_.Line }
              throw "Detected fatal Core/database startup error in isolated runtime."
            }
          }
          finally {
            if ($null -ne $desktop) {
              taskkill /PID $desktop.Id /T /F 2>$null | Out-Null
            }
          }

      - name: Package ZIP and checksums
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "pathena-portable-r4\pATHENA"
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Copy-Item -LiteralPath $src -Destination $stage -Recurse
          $zip = Join-Path $env:RUNNER_TEMP "$env:PACKAGE_NAME.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          @"
          pATHENA Windows Portable R4
          Source: develop/pathena-next@$env:SOURCE_SHA
          Package: $env:PACKAGE_NAME.zip
          SHA-256: $hash
          "@ | Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP "$env:PACKAGE_NAME-SHA256.txt")
          Write-Host "SHA256=$hash"

      - name: Upload tested Windows portable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.PACKAGE_NAME }}.zip
            ${{ runner.temp }}/${{ env.PACKAGE_NAME }}-SHA256.txt
          if-no-files-found: error
          retention-days: 7
