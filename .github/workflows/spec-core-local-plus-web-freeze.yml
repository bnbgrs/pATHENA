name: Spec Core Local+Web Freeze Apply

on:
  push:
    branches:
      - postmerge/spec-core
    paths:
      - scripts/apply_spec_core_local_plus_web_freeze.py
      - .github/workflows/spec-core-local-plus-web-freeze.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out worker
        uses: actions/checkout@v6
        with:
          ref: postmerge/spec-core
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Validate dependency lock
        run: uv lock --check

      - name: Apply deterministic product and acceptance patch
        run: python scripts/apply_spec_core_local_plus_web_freeze.py

      - name: Correct exact tuple result type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/athena/research/repository.py")
          text = path.read_text(encoding="utf-8")
          old = '''                rows = [\n                    row\n                    for row in rows\n                    if (\n                        uuid_from_blob(bytes(row["source_id"]))\n                        not in all_external_source_ids\n                        or uuid_from_blob(bytes(row["source_id"])) in authorized\n                    )\n                ]\n'''
          new = '''                rows = tuple(\n                    row\n                    for row in rows\n                    if (\n                        uuid_from_blob(bytes(row["source_id"]))\n                        not in all_external_source_ids\n                        or uuid_from_blob(bytes(row["source_id"])) in authorized\n                    )\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit("tuple correction anchor did not match exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          test_path = Path("tests/unit/test_research_local_plus_web.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_path.write_text(test_text.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Focused Research regressions
        run: >-
          uv run --locked --extra dev pytest -q
          tests/unit/test_research_local_plus_web.py
          tests/unit/test_research_historical_backfill.py
          tests/unit/test_research_scoped_project.py

      - name: Ruff focused slice
        run: >-
          uv run --locked --extra dev python -m ruff check
          src/athena/research/repository.py
          tests/unit/test_research_local_plus_web.py
          tests/unit/test_research_historical_backfill.py
          tests/unit/test_research_scoped_project.py

      - name: mypy Research repository
        run: uv run --locked --extra dev python -m mypy src/athena/research/repository.py

      - name: Commit verified slice
        run: |
          git config user.name "pATHENA spec-core automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/athena/research/repository.py tests/unit/test_research_local_plus_web.py scripts/apply_spec_core_local_plus_web_freeze.py .github/workflows/spec-core-local-plus-web-freeze.yml
          git diff --cached --check
          git commit -m "research: freeze truthful Local+Web candidate union"
          git push origin HEAD:postmerge/spec-core
