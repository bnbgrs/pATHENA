name: Backend Research Source Types Boundaries

on:
  push:
    branches:
      - postmerge/backend

permissions:
  contents: write

jobs:
  harden-source-types-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: postmerge/backend
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply bounded source-types patch
        shell: python
        run: |
          from pathlib import Path

          service = Path('src/athena/research/service.py')
          text = service.read_text(encoding='utf-8')
          old = '''        normalized_projects = _stable_uuids(project_ids)\n        if any(not isinstance(item, SourceType) for item in source_types):\n            raise ResearchConfigurationError(\n                "source_types must contain SourceType values only."\n            )\n        normalized_source_types = tuple(sorted({item.value for item in source_types}))\n        normalized_sources = _stable_uuids(explicit_source_ids)\n'''
          new = '''        normalized_projects = _stable_uuids(project_ids)\n        normalized_source_types = _stable_source_types(source_types)\n        normalized_sources = _stable_uuids(explicit_source_ids)\n'''
          if old not in text:
              raise SystemExit('source_types normalization anchor not found')
          text = text.replace(old, new, 1)
          helper_anchor = '''def _stable_uuids(values: object) -> tuple[uuid.UUID, ...]:\n'''
          helper = '''def _stable_source_types(values: object) -> tuple[str, ...]:\n    if (\n        isinstance(values, (str, bytes, bytearray))\n        or not isinstance(values, Sequence)\n    ):\n        raise ResearchConfigurationError(\n            "source_types must be a sequence of SourceType values."\n        )\n    if any(not isinstance(item, SourceType) for item in values):\n        raise ResearchConfigurationError(\n            "source_types must contain SourceType values only."\n        )\n    return tuple(sorted({item.value for item in values}))\n\n\n'''
          if helper_anchor not in text:
              raise SystemExit('_stable_uuids helper anchor not found')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          service.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/test_research_stable_strings_boundaries.py')
          t = tests.read_text(encoding='utf-8')
          old_import = '''from athena.research.service import (\n    ResearchConfigurationError,\n    _stable_strings,\n    _stable_uuids,\n)\n'''
          new_import = '''from athena.research.service import (\n    ResearchConfigurationError,\n    _stable_source_types,\n    _stable_strings,\n    _stable_uuids,\n)\nfrom athena.source.models import SourceType\n'''
          if old_import not in t:
              raise SystemExit('test import anchor not found')
          t = t.replace(old_import, new_import, 1)
          addition = '''\n\n@pytest.mark.parametrize(\n    "value",\n    [set(SourceType), {next(iter(SourceType))}],\n)\ndef test_stable_source_types_rejects_non_sequence_containers(value: object) -> None:\n    with pytest.raises(\n        ResearchConfigurationError, match="sequence of SourceType values"\n    ):\n        _stable_source_types(value)\n\n\ndef test_stable_source_types_preserves_deterministic_normalization() -> None:\n    values = list(SourceType)\n    assert values\n    expected = tuple(sorted({item.value for item in values}))\n    assert _stable_source_types([*reversed(values), values[0]]) == expected\n'''
          if 'test_stable_source_types_rejects_non_sequence_containers' not in t:
              t += addition
          tests.write_text(t, encoding='utf-8')
      - name: Focused tests
        run: python -m pytest -q tests/unit/test_research_stable_strings_boundaries.py
      - name: Ruff
        run: python -m ruff check src/athena/research/service.py tests/unit/test_research_stable_strings_boundaries.py
      - name: Mypy
        run: python -m mypy src/athena/research/service.py
      - name: Diff check
        run: git diff --check
      - name: Commit bounded product and tests
        run: |
          git config user.name 'pATHENA Backend Bot'
          git config user.email 'backend-bot@users.noreply.github.com'
          git add src/athena/research/service.py tests/unit/test_research_stable_strings_boundaries.py
          git commit -m 'fix(research): harden source type container boundary'
          git push origin HEAD:postmerge/backend
