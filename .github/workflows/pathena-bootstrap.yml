name: pATHENA Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - ".pathena/bootstrap-request"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pathena-bootstrap-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  import-baseline:
    name: Import ATHENA baseline
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPOSITORY: bnbgrs/ATHENA
      SOURCE_COMMIT: 8b02beec4f5ef83344e405f92074072623e8b318
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out pATHENA bootstrap branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Stop when baseline is already present
        id: baseline
        shell: bash
        run: |
          if test -f PATHENA_BASELINE.md && test -f pyproject.toml && test -d src && test -d tests; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch exact ATHENA source snapshot
        if: steps.baseline.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pathena-source
          git init -q /tmp/pathena-source
          git -C /tmp/pathena-source remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C /tmp/pathena-source fetch --depth=1 origin "${SOURCE_COMMIT}"
          git -C /tmp/pathena-source checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/pathena-source rev-parse HEAD)" = "${SOURCE_COMMIT}"

      - name: Build independent pATHENA working tree
        if: steps.baseline.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/pathena-source/ ./
          rm -rf .pathena
          rm -f .pathena-bootstrap
          {
            echo '# pATHENA baseline'
            echo
            echo 'pATHENA is an independent experimental development line derived from ATHENA.'
            echo
            echo "- Source repository: https://github.com/${SOURCE_REPOSITORY}"
            echo "- Source commit: ${SOURCE_COMMIT}"
            echo '- Development branch: agent/pathena'
            echo '- ATHENA remains read-only for pATHENA development.'
            echo
            echo 'The newer user-provided ATHENA working-tree snapshot is an ADAPT source for subsequent quality-gated slices.'
          } > PATHENA_BASELINE.md

      - name: Set up Python 3.12
        if: steps.baseline.outputs.complete != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver and desktop runtime
        if: steps.baseline.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1

      - name: Validate imported baseline
        if: steps.baseline.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run --locked --extra dev --extra desktop python scripts/quality.py

      - name: Commit verified baseline to bootstrap branch
        if: steps.baseline.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          test "${remote_head}" = "${expected}"
          git config user.name "pATHENA Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: import verified ATHENA baseline for pATHENA"
          git push origin "HEAD:${branch}"
