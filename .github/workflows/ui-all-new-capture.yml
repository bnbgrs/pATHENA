name: pATHENA Unified All-New UI Capture

on:
  push:
    branches:
      - capture/ui-all-new-20260915
    paths:
      - ".github/workflows/ui-all-new-capture.yml"
      - "src/athena/desktop/**"
      - "scripts/render_pathena_ui_snapshot.py"
      - "scripts/render_pathena_ui_snapshot_fontsafe.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  capture:
    name: Render unified UI on Windows
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: "."
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_OPENGL: software
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install locked desktop environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.21"
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv.lock is not current." }
          uv sync --locked --extra dev --extra desktop
          if ($LASTEXITCODE -ne 0) { throw "Locked environment sync failed." }
      - name: Render eleven real Qt surfaces
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "pathena-unified-visual-runtime"
          $actualRoot = Join-Path (Get-Location) "artifacts\visual-actual"
          uv run --locked --extra desktop --no-sync python scripts/render_pathena_ui_snapshot_fontsafe.py `
            --runtime-root $runtimeRoot `
            --screenshot-directory $actualRoot `
            --initial-delay-seconds 7
          if ($LASTEXITCODE -ne 0) { throw "Eleven-surface capture failed." }
      - name: Upload unified screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pathena-unified-ui-${{ github.sha }}
          path: artifacts/visual-actual/**
          if-no-files-found: error
          retention-days: 14
