name: pATHENA reserve pressure contract

on:
  push:
    branches:
      - bot/pathena-cloud-windows
    paths:
      - .github/workflows/windows-reserve-pressure-contract.yml
      - .github/windows-candidate-request.txt

permissions:
  contents: read

jobs:
  exact-reserve-pressure-contract:
    name: Exact candidate reserve pressure contract on Windows Server 2025
    if: >-
      startsWith(github.event.head_commit.message, 'test(windows): request exact candidate')
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: harness
          persist-credentials: false

      - name: Resolve exact candidate
        shell: pwsh
        run: |
          $candidate = (Get-Content 'harness\.github\windows-candidate-request.txt' -Raw).Trim().ToLowerInvariant()
          if ($candidate -notmatch '^[0-9a-f]{40}$') { throw 'Candidate request must be an exact lowercase SHA.' }
          "CANDIDATE_SHA=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout exact candidate SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Prove immutable candidate identity
        shell: pwsh
        run: |
          $checkedOut = (git -C candidate rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkedOut -ne $env:CANDIDATE_SHA) { throw "Checked out $checkedOut instead of $env:CANDIDATE_SHA." }

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install locked development environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.11.21'
          if ($LASTEXITCODE -ne 0) { throw 'uv installation failed.' }
          Push-Location candidate
          try {
            uv lock --check
            if ($LASTEXITCODE -ne 0) { throw 'uv.lock is not current.' }
            uv sync --locked --extra dev
            if ($LASTEXITCODE -ne 0) { throw 'Locked development sync failed.' }
          } finally { Pop-Location }

      - name: Ruff reserve pressure
        shell: pwsh
        run: |
          Push-Location candidate
          try {
            uv run --locked --extra dev --no-sync ruff check `
              src/athena/storage/emergency_reserve.py `
              src/athena/storage/disk_pressure.py `
              tests/unit/test_emergency_reserve.py `
              tests/unit/test_disk_pressure.py
            if ($LASTEXITCODE -ne 0) { throw 'Reserve pressure Ruff contract failed.' }
          } finally { Pop-Location }

      - name: Mypy reserve pressure
        shell: pwsh
        run: |
          Push-Location candidate
          try {
            uv run --locked --extra dev --no-sync mypy `
              src/athena/storage/emergency_reserve.py `
              src/athena/storage/disk_pressure.py
            if ($LASTEXITCODE -ne 0) { throw 'Reserve pressure mypy contract failed.' }
          } finally { Pop-Location }

      - name: Pytest reserve pressure
        shell: pwsh
        run: |
          Push-Location candidate
          try {
            uv run --locked --extra dev --no-sync pytest -q `
              tests/unit/test_emergency_reserve.py `
              tests/unit/test_disk_pressure.py
            if ($LASTEXITCODE -ne 0) { throw 'Reserve pressure tests failed.' }
          } finally { Pop-Location }
