name: pATHENA promotion readiness

on:
  push:
    branches:
      - bot/pathena-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promotion-guard:
    name: Candidate promotion guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out candidate
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Validate dependency lock
        run: uv lock --check

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Run fail-closed promotion guard
        run: python scripts/promotion_guard.py --actual-ref "$GITHUB_REF"

      - name: Ruff import rules
        run: uv run --locked --extra dev --no-sync ruff check --select I scripts/promotion_guard.py

      - name: Ruff bugbear rules
        run: uv run --locked --extra dev --no-sync ruff check --select B scripts/promotion_guard.py

      - name: Ruff error and pyflakes rules
        run: uv run --locked --extra dev --no-sync ruff check --select E4,E7,E9,F scripts/promotion_guard.py

      - name: Ruff promotion guard tests
        run: uv run --locked --extra dev --no-sync ruff check tests/unit/test_promotion_guard.py

      - name: Mypy promotion guard
        run: uv run --locked --extra dev --no-sync mypy scripts/promotion_guard.py

      - name: Test promotion guard
        run: uv run --locked --extra dev --no-sync pytest -q tests/unit/test_promotion_guard.py
