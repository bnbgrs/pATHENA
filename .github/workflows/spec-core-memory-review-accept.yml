name: Spec Core Memory Review Acceptance

on:
  push:
    branches:
      - postmerge/spec-core
    paths:
      - scripts/apply_spec_core_memory_review_accept.py
      - .github/workflows/spec-core-memory-review-accept.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: postmerge/spec-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Apply deterministic patch
        run: python scripts/apply_spec_core_memory_review_accept.py
      - name: Focused tests
        run: >-
          python -m pytest
          tests/unit/test_personal_memory_inferred_review.py
          tests/unit/test_personal_memory_review_acceptance.py
          tests/unit/test_personal_memory.py
      - name: Ruff
        run: python -m ruff check src/athena/memory tests/unit/test_personal_memory_inferred_review.py tests/unit/test_personal_memory_review_acceptance.py tests/unit/test_personal_memory.py
      - name: Mypy
        run: python -m mypy src/athena/memory
      - name: Diff check
        run: git diff --check
      - name: Commit product and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/athena/memory/repository.py src/athena/memory/service.py tests/unit/test_personal_memory_review_acceptance.py
          git commit -m 'feat(memory): accept reviewed inferred memory with provenance'
          git push origin HEAD:postmerge/spec-core
