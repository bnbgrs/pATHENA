name: Backend direct fallback TTL boundary

on:
  push:
    branches:
      - postmerge/backend
    paths:
      - .github/workflows/backend-direct-fallback-ttl.yml

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Apply bounded TTL boundary patch
        shell: python
        run: |
          from pathlib import Path

          gateway = Path('src/athena/external/gateway.py')
          text = gateway.read_text(encoding='utf-8')
          old = '''        if type(ttl_seconds) is not int:\n            raise ExternalAuthorizationError(\n                "Direct fallback authorization TTL must be an integer number of seconds."\n            )\n        source = self.get_authorization(authorization_id)\n'''
          new = '''        if type(ttl_seconds) is not int or ttl_seconds < 1 or ttl_seconds > 900:\n            raise ExternalAuthorizationError(\n                "Direct fallback authorization TTL must be between 1 and 900 seconds."\n            )\n        source = self.get_authorization(authorization_id)\n'''
          if old not in text:
              raise SystemExit('expected direct-fallback TTL block not found exactly once')
          if text.count(old) != 1:
              raise SystemExit('expected direct-fallback TTL block count != 1')
          gateway.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/unit/test_external_access_gateway_authorization_boundaries.py')
          test_text = tests.read_text(encoding='utf-8')
          addition = '''\n\n@pytest.mark.parametrize("ttl_seconds", [0, -1, 901, 10_000])\ndef test_authorize_direct_fallback_rejects_out_of_range_ttl_before_authorization_lookup(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n    ttl_seconds: int,\n) -> None:\n    app = AthenaApplication(settings=AthenaSettings(local_root=tmp_path / "fallback-ttl-boundary"))\n    app.start()\n    source = app.external_access.authorize_explicit(\n        purpose="fallback source",\n        allowed_hosts=("example.com",),\n    )\n    monkeypatch.setattr(app.external_access, "get_authorization", _fail_authorization_lookup)\n    with pytest.raises(ExternalAuthorizationError, match="between 1 and 900 seconds"):\n        app.external_access.authorize_direct_fallback(\n            source.authorization_id,\n            host="example.com",\n            ttl_seconds=ttl_seconds,\n        )\n    app.stop()\n\n\n@pytest.mark.parametrize("ttl_seconds", [1, 900])\ndef test_authorize_direct_fallback_preserves_valid_ttl_range(\n    tmp_path: Path,\n    ttl_seconds: int,\n) -> None:\n    app = AthenaApplication(settings=AthenaSettings(local_root=tmp_path / f"fallback-valid-ttl-{ttl_seconds}"))\n    app.start()\n    source = app.external_access.authorize_explicit(\n        purpose="fallback source",\n        allowed_hosts=("example.com",),\n        ttl_seconds=1800,\n    )\n    direct = app.external_access.authorize_direct_fallback(\n        source.authorization_id,\n        host="example.com",\n        ttl_seconds=ttl_seconds,\n    )\n    assert direct.privacy_route == "direct_explicit"\n    remaining_us = direct.expires_at_us - direct.created_at_us\n    assert 0 < remaining_us <= ttl_seconds * 1_000_000\n    app.stop()\n'''
          marker = 'test_authorize_direct_fallback_rejects_out_of_range_ttl_before_authorization_lookup'
          if marker in test_text:
              raise SystemExit('TTL boundary tests already exist')
          tests.write_text(test_text.rstrip() + addition.rstrip() + '\n', encoding='utf-8')
      - name: Focused gateway tests
        run: >-
          python -m pytest -q
          tests/unit/test_external_access_gateway_authorization_boundaries.py
          tests/unit/test_external_access_gateway_runtime_boundaries.py
          tests/unit/test_external_access_gateway.py
      - name: Ruff
        run: python -m ruff check src/athena/external/gateway.py tests/unit/test_external_access_gateway_authorization_boundaries.py
      - name: Mypy
        run: python -m mypy src/athena/external/gateway.py
      - name: Diff check
        run: git diff --check
      - name: Commit verified product and tests
        run: |
          git config user.name 'pATHENA Backend Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/athena/external/gateway.py tests/unit/test_external_access_gateway_authorization_boundaries.py
          git commit -m 'fix(external): validate direct fallback TTL before lookup'
          git push origin HEAD:postmerge/backend
