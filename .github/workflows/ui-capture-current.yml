name: pATHENA Current UI Capture

on:
  pull_request:
    branches:
      - agent/pathena
    paths:
      - ".github/workflows/ui-capture-current.yml"
      - "scripts/capture_current_ui_states.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture current pATHENA desktop states
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PATHENA_UI_CAPTURE_DIR: artifacts/current-ui-states

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1

      - name: Validate dependency lock
        run: uv lock --check

      - name: Capture current code-based UI states
        run: uv run --locked --extra desktop python scripts/capture_current_ui_states.py

      - name: Verify screenshot count
        run: |
          count=$(find artifacts/current-ui-states -maxdepth 1 -name '*.png' | wc -l)
          test "$count" -eq 8
          find artifacts/current-ui-states -maxdepth 1 -name '*.png' -printf '%f\n' | sort

      - name: Upload current UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pathena-current-ui-screenshots
          path: artifacts/current-ui-states/*.png
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
