name: Apply Core Local+Web Slice

on:
  push:
    branches:
      - postmerge/spec-core
    paths:
      - .github/workflows/apply-local-plus-web.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: postmerge/spec-core
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Apply deterministic Local+Web slice
        run: python scripts/apply_spec_core_local_plus_web.py

      - name: Validate focused Core regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv lock --check
          uv run --locked --extra dev --extra desktop python -m pytest -q tests/unit/test_research_local_plus_web.py tests/unit/test_research_scoped_project.py tests/unit/test_research_historical_backfill.py
          uv run --locked --extra dev --extra desktop python -m ruff check src/athena/research/service.py src/athena/jobs/payload_validation.py src/athena/external/gateway.py tests/unit/test_research_local_plus_web.py
          uv run --locked --extra dev --extra desktop python -m mypy src/athena/research/service.py src/athena/jobs/payload_validation.py src/athena/external/gateway.py

      - name: Commit exact product and acceptance slice
        run: |
          git config user.name "pATHENA Core Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-local-plus-web.yml scripts/apply_spec_core_local_plus_web.py
          git add src/athena/research/service.py src/athena/jobs/payload_validation.py src/athena/external/gateway.py tests/unit/test_research_local_plus_web.py
          git commit -m "core(research): persist truthful Local+Web scope"
          git push origin HEAD:postmerge/spec-core
