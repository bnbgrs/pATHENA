name: Capture current pATHENA UI 2026-08-26

on:
  push:
    branches:
      - capture/current-ui-20260826-1736
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_OPENGL: software
      PATHENA_SCREENSHOT_DIR: screenshots-current-live
    steps:
      - name: Checkout isolated capture branch
        uses: actions/checkout@v4

      - name: Prove product source equals requested candidate
        shell: pwsh
        run: |
          git diff --exit-code faab8fb19c20eacd3594d5dbad67758aa194f06d -- src/athena pyproject.toml uv.lock
          if ($LASTEXITCODE -ne 0) { throw "Capture branch product source differs from requested candidate." }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked desktop environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.21"
          uv sync --locked --extra dev --extra desktop
          if ($LASTEXITCODE -ne 0) { throw "Locked environment sync failed." }

      - name: Start real current pATHENA program and capture screens
        shell: pwsh
        run: |
          uv run --locked --extra desktop --no-sync python scripts/capture_live_current_ui_20260826.py
          Get-ChildItem .\screenshots-current-live -File | Select-Object Name,Length

      - name: Upload current screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pATHENA-current-live-faab8fb1
          path: screenshots-current-live/
          if-no-files-found: error
          retention-days: 7
