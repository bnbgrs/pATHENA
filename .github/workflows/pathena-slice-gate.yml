name: pATHENA Slice Gate

on:
  push:
    branches:
      - agent/pathena
    paths:
      - ".pathena/slices/**"
  pull_request:
    branches:
      - agent/pathena

permissions:
  contents: write

concurrency:
  group: pathena-slice-agent-pathena
  cancel-in-progress: true

jobs:
  validate-and-commit:
    name: Validate and commit pATHENA slice
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'agent/pathena' &&
        github.event.pull_request.head.ref == 'bootstrap/import-current' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      SLICE_DIR: .pathena/slices/001-durable-send-identity
      PATCH_SHA256: e1ad904a567685a66dd3e4720fb89e1e84dba30a828204008f6f5f609842803c

    steps:
      - name: Check out pATHENA development branch
        uses: actions/checkout@v6
        with:
          ref: agent/pathena
          fetch-depth: 0

      - name: Require complete baseline and slice carrier
        shell: bash
        run: |
          set -euo pipefail
          test -f PATHENA_BASELINE.md
          test -f pyproject.toml
          test -d src
          test -d tests
          test -f "${SLICE_DIR}/000.b64"
          test -f "${SLICE_DIR}/001.b64"
          test -f "${SLICE_DIR}/002.b64"
          test -f "${SLICE_DIR}/003.b64"
          test -f "${SLICE_DIR}/manifest.txt"

      - name: Reconstruct and verify slice patch
        shell: bash
        run: |
          set -euo pipefail
          cat "${SLICE_DIR}/000.b64" \
              "${SLICE_DIR}/001.b64" \
              "${SLICE_DIR}/002.b64" \
              "${SLICE_DIR}/003.b64" \
            | base64 --decode \
            | gzip -dc > /tmp/pathena-slice.patch
          printf '%s  %s\n' "${PATCH_SHA256}" /tmp/pathena-slice.patch \
            | sha256sum --check --strict
          git apply --check /tmp/pathena-slice.patch
          git apply /tmp/pathena-slice.patch

      - name: Remove validation carrier from candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- "${SLICE_DIR}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/athena/chat/request_fingerprint.py \
            src/athena/chat/send_operation.py \
            src/athena/storage/schema.py \
            src/athena/storage/schema_contract.py \
            src/athena/storage/schema_evolution.py \
            src/athena/storage/schema_verification.py

      - name: Ruff gate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run --locked --extra dev python -m ruff check src tests scripts

      - name: Mypy gate
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --extra dev python -m mypy src/athena

      - name: Targeted tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --extra dev python -m pytest -q \
            tests/unit/test_chat_request_fingerprint.py \
            tests/unit/test_chat_send_operation_repository.py \
            tests/unit/test_schema_v41_chat_send_operations.py \
            tests/unit/test_grounded_response_receipt.py \
            tests/unit/test_knowledge_schema.py \
            tests/unit/test_protected_source_semantic_schema.py \
            tests/unit/test_schema_evolution_boundary.py \
            tests/unit/test_schema_verification_boundary.py

      - name: Commit verified slice to agent/pathena
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/pathena"
          if test "${{ github.event_name }}" = "push"; then
            expected="${{ github.sha }}"
          else
            expected="${{ github.event.pull_request.base.sha }}"
          fi
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          test "${remote_head}" = "${expected}"
          git config user.name "pATHENA Slice Gate"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            src/athena/chat/request_fingerprint.py \
            src/athena/chat/send_operation.py \
            src/athena/storage/schema.py \
            src/athena/storage/schema_contract.py \
            src/athena/storage/schema_evolution.py \
            src/athena/storage/schema_verification.py \
            tests/unit/test_chat_request_fingerprint.py \
            tests/unit/test_chat_send_operation_repository.py \
            tests/unit/test_schema_v41_chat_send_operations.py \
            tests/unit/test_grounded_response_receipt.py \
            tests/unit/test_knowledge_schema.py \
            tests/unit/test_protected_source_semantic_schema.py \
            tests/unit/test_schema_evolution_boundary.py \
            tests/unit/test_schema_verification_boundary.py
          git diff --cached --check
          git commit -m "feat(chat): add durable send operation identity"
          git push origin "HEAD:${branch}"
