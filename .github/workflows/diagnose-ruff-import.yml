name: Diagnose Ruff Import
on:
  push:
    branches:
      - qol/chat-pinning-20261005-sol
jobs:
  ruff-import-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: pip install uv==0.11.21
      - name: Print exact Ruff import fix
        run: |
          set +e
          uv run --locked --extra dev --extra desktop python -m ruff check --select I --fix --diff tests/unit/test_unified_recovery_continue.py
          code=$?
          echo "RUFF_DIFF_EXIT=$code"
          exit 0
