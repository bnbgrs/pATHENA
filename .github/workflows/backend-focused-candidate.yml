name: pATHENA Backend Focused Candidate

on:
  pull_request:
    branches:
      - develop/pathena-next
    paths:
      - "src/athena/jobs/**"
      - "tests/unit/test_job*.py"
      - ".github/workflows/backend-focused-candidate.yml"

permissions:
  contents: read

concurrency:
  group: pathena-backend-focused-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  focused-backend-contract:
    name: Exact Backend jobs lint typecheck and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Resolve exact worker head and base
        shell: pwsh
        run: |
          $candidate = "${{ github.event.pull_request.head.sha }}".Trim().ToLowerInvariant()
          $base = "${{ github.event.pull_request.base.sha }}".Trim().ToLowerInvariant()
          if ($candidate -notmatch "^[0-9a-f]{40}$") { throw "pull-request head SHA must be exactly 40 lowercase hexadecimal characters." }
          if ($base -notmatch "^[0-9a-f]{40}$") { throw "pull-request base SHA must be exactly 40 lowercase hexadecimal characters." }
          "CANDIDATE_SHA=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASE_SHA=$base" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check out exact worker head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove immutable checked-out identity
        shell: pwsh
        run: |
          $checkedOut = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $checkedOut -ne $env:CANDIDATE_SHA) { throw "Checked out $checkedOut instead of exact candidate $env:CANDIDATE_SHA." }
          git cat-file -e "$env:BASE_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "PR base commit $env:BASE_SHA is unavailable for exact diff selection." }

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install locked focused-test environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.21"
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv.lock is not current." }
          uv sync --locked --extra dev --extra desktop
          if ($LASTEXITCODE -ne 0) { throw "Locked environment sync failed." }

      - name: Ruff changed Backend jobs Python files
        id: ruff
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".focused-evidence" | Out-Null
          $changed = @(git diff --name-only $env:BASE_SHA $env:CANDIDATE_SHA -- "src/athena/jobs/*.py" "tests/unit/test_job*.py")
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve changed Backend jobs Python files." }
          if ($changed.Count -eq 0) { "No changed Backend jobs Python files selected for Ruff." | Tee-Object -FilePath ".focused-evidence/ruff.txt" | Write-Host; exit 0 }
          $output = @(& uv run --locked --extra dev --extra desktop --no-sync ruff check @changed 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath ".focused-evidence/ruff.txt" | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "Exact changed-file Ruff contract failed." }

      - name: Type-check Backend jobs package
        id: mypy
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".focused-evidence" | Out-Null
          $output = @(& uv run --locked --extra dev --extra desktop --no-sync python -m mypy src/athena/jobs 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath ".focused-evidence/mypy.txt" | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "Backend jobs mypy contract failed." }

      - name: Run changed Backend jobs unit tests
        id: focused_tests
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".focused-evidence" | Out-Null
          $tests = @(git diff --name-only $env:BASE_SHA $env:CANDIDATE_SHA -- "tests/unit/test_job*.py" | Where-Object { $_ -match '^tests/unit/test_job.*\.py$' })
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve changed Backend jobs tests." }
          if ($tests.Count -eq 0) { "No changed Backend jobs tests selected." | Tee-Object -FilePath ".focused-evidence/pytest.txt" | Write-Host; exit 0 }
          $output = @(& uv run --locked --extra dev --extra desktop --no-sync pytest -q @tests 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath ".focused-evidence/pytest.txt" | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "Exact changed-test Backend candidate contract failed." }

      - name: Upload exact focused diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-focused-diagnostics-${{ env.CANDIDATE_SHA }}
          path: .focused-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Enforce focused candidate outcomes
        if: always()
        shell: pwsh
        run: |
          $ruff = "${{ steps.ruff.outcome }}"
          $mypy = "${{ steps.mypy.outcome }}"
          $tests = "${{ steps.focused_tests.outcome }}"
          Write-Host "Ruff outcome: $ruff"
          Write-Host "Backend jobs mypy outcome: $mypy"
          Write-Host "Focused pytest outcome: $tests"
          if ($ruff -ne "success" -or $mypy -ne "success" -or $tests -ne "success") { throw "Backend focused candidate requires Ruff, jobs mypy and focused pytest to succeed." }
