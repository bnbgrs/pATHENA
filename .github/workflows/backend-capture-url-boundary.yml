name: Backend capture URL boundary verifier

on:
  push:
    branches:
      - postmerge/backend
    paths:
      - .github/workflows/backend-capture-url-boundary.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: postmerge/backend
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Apply bounded product and test patch
        shell: python
        run: |
          from pathlib import Path

          gateway = Path('src/athena/external/gateway.py')
          text = gateway.read_text(encoding='utf-8')
          needle = '''    ) -> SourceCaptureResult:\n        if type(max_bytes) is not int or max_bytes < 1 or max_bytes > 128 * 1024 * 1024:\n'''
          replacement = '''    ) -> SourceCaptureResult:\n        if not isinstance(url, str):\n            raise ExternalDestinationError("External URL must be text.")\n        if type(max_bytes) is not int or max_bytes < 1 or max_bytes > 128 * 1024 * 1024:\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one capture_url insertion point, found {text.count(needle)}')
          gateway.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          tests = Path('tests/unit/test_external_access_gateway_authorization_boundaries.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'def test_capture_url_rejects_non_text_url_before_authorization_lookup('
          if marker not in test_text:
              test_text = test_text.rstrip() + '''\n\n\n@pytest.mark.parametrize("url", [None, 7, True, b"https://example.com", []])\ndef test_capture_url_rejects_non_text_url_before_authorization_lookup(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n    url: object,\n) -> None:\n    app = AthenaApplication(settings=AthenaSettings(local_root=tmp_path / "capture-url-boundary"))\n    app.start()\n    monkeypatch.setattr(app.external_access, "_authorized_or_audit", _fail_authorization_lookup)\n    with pytest.raises(ExternalAuthorizationError, match="URL must be text"):\n        app.external_access.capture_url(\n            __import__("uuid").uuid4(),\n            url,  # type: ignore[arg-type]\n        )\n    app.stop()\n'''
              tests.write_text(test_text + '\n', encoding='utf-8')
      - name: Focused Gateway tests
        run: >-
          python -m pytest -q
          tests/unit/test_external_access_gateway_authorization_boundaries.py
          tests/unit/test_external_access_gateway_runtime_boundaries.py
          tests/unit/test_external_access_gateway.py
      - name: Ruff
        run: python -m ruff check src/athena/external/gateway.py tests/unit/test_external_access_gateway_authorization_boundaries.py tests/unit/test_external_access_gateway_runtime_boundaries.py tests/unit/test_external_access_gateway.py
      - name: Mypy
        run: python -m mypy src/athena/external/gateway.py
      - name: Diff check
        run: git diff --check
      - name: Commit bounded slice
        run: |
          git config user.name 'pATHENA Backend Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/athena/external/gateway.py tests/unit/test_external_access_gateway_authorization_boundaries.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(external): reject non-text capture URLs early'
          git push origin HEAD:postmerge/backend
